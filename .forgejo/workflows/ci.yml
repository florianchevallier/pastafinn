name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: pastafinn

jobs:
  validate:
    name: Check, build, e2e
    # Host runner: the e2e test starts a throwaway Jellyfin with the host's Docker.
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Biome, TypeScript, unit tests, knip, React Doctor
      - run: npm run check

      - run: npm run build

      - name: Cache Chromium (Playwright)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install chromium

      - name: End-to-end against Jellyfin in Docker
        run: npm run e2e
        env:
          CI: "1"
          # Distinct ports so a run never collides with something already listening on the host.
          JELLYFIN_PORT: "8199"

  deploy:
    name: Build image & deploy
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # semver tags also get "latest" automatically
          tags: type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Trigger deployment (Watchtower)
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.UPDATE_TOKEN }}" \
               "${{ vars.WATCHTOWER_URL }}/v1/update?image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
